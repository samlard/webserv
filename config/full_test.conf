# Full-featured configuration for testing

server {
	listen 8080;
	server_name localhost;
	root ./www;
	index index.html;
	client_max_body_size 10485760;
	
	location / {
		allow_methods GET POST DELETE;
		autoindex on;
	}
	
	location /uploads {
		allow_methods GET POST DELETE;
		upload_path ./www/uploads;
		autoindex on;
	}
}
