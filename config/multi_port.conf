# Multi-port configuration with CGI

server {
	listen 8080;
	server_name localhost;
	root ./www;
	index index.html;
	
	location / {
		allow_methods GET POST DELETE;
		autoindex on;
	}
	
	location /uploads {
		allow_methods GET POST DELETE;
		upload_path ./www/uploads;
		autoindex on;
	}
	
	location /cgi-bin {
		allow_methods GET POST;
		root ./www/cgi-bin;
		cgi_extension .sh;
	}
}

server {
	listen 8081;
	server_name test.local;
	root ./www;
	index index.html;
	
	location / {
		allow_methods GET;
		autoindex on;
	}
}
