		allow_methods GET POST DELETE;
		autoindex on;
	}
	
	location /uploads {
		allow_methods GET POST DELETE;
		upload_path /var/www/uploads;
		autoindex on;
	}
	
	location /cgi-bin {
		allow_methods GET POST;
		root /var/www/cgi-bin;
		cgi_extension .sh .py;
		cgi_path /usr/bin/python;
	}
}

server {
	listen 8081;
	server_name example.com;
	root /var/www/example;
	index index.html index.htm;
	
	location / {
		allow_methods GET;
	}
	
	location /redirect {
		return /;
	}
}
