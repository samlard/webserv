# webserv configuration file

server {
	listen 8080;
	server_name localhost;
	root ./www;
	index index.html;
	client_max_body_size 10485760;

	error_page 404 /404.html;
	error_page 500 /500.html;

	location / {
		allow_methods GET POST DELETE;
		autoindex on;
	}

	location /uploads {
		allow_methods GET POST DELETE;
		upload_path ./www/uploads;
		autoindex on;
	}

	location /cgi-bin {
		allow_methods GET POST;
		root ./www/cgi-bin;
		cgi_extension .sh .py;
	}

	location /redirect {
		return 301 /;
	}
}

server {
	listen 8081;
	server_name example.com;
	root ./www;
	index hello.html;

	location / {
		allow_methods GET;
	}
}
