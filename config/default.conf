# webserv configuration file
# Inspired by nginx syntax

server {
	listen 8080;
	server_name localhost;
	root /var/www/html;
	index index.html;
	client_max_body_size 10485760;
	
	error_page 404 /404.html;
	error_page 500 /500.html;
ok man
